<!doctype html>
<html lang="en" data-refraction="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>{{ title }}</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon/favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; overflow-x: hidden; perspective: 1200px; }
    /* short screens (phones in landscape): tighter card, and the page scrolls instead of cutting it off */
    @media (max-height: 600px) {
      body { padding: 12px; place-items: start center; }
      .login { padding: 18px 24px 16px; gap: 9px; }
      .login img { width: 42px; height: 42px; margin-bottom: 0; }
      .login p { margin: -6px 0 2px; }
      .field input { padding: 10px 13px; }
      .go { padding: 11px; margin-top: 2px; }
    }

    /* night sky: deep gradient + faint nebula, with the constellation canvas on top */
    .sky { position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(1100px 700px at 78% 12%, rgba(88,70,200,.28), transparent 60%),
        radial-gradient(900px 650px at 12% 88%, rgba(20,120,150,.22), transparent 60%),
        radial-gradient(700px 500px at 50% 50%, rgba(40,60,140,.18), transparent 70%),
        linear-gradient(180deg, #05060d 0%, #080b1a 55%, #0b0c18 100%); }
    #stars { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; display: block; }
    .login { position: relative; z-index: 1; width: min(400px, 100%); padding: 38px 32px 30px; display: flex; flex-direction: column; gap: 14px;
      text-align: center; border-radius: 30px; transform-style: preserve-3d; transition: transform .25s ease-out;
      background: linear-gradient(150deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 40%, rgba(255,255,255,.09) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.08), inset 0 0 40px rgba(255,255,255,.05),
        0 40px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06); }
    html[data-refraction="on"] .login { backdrop-filter: blur(20px) url(#liquidStrong) saturate(190%) brightness(1.08); }
    /* 8K-class screens: skip the live refraction/blur (see glass.css) and pre-blend the frost instead */
    @media (min-width: 6000px), (min-width: 3200px) and (min-resolution: 1.75dppx) {
      html[data-refraction="on"] .login, .login { backdrop-filter: none; -webkit-backdrop-filter: none;
        background: linear-gradient(150deg, rgba(70,78,120,.82) 0%, rgba(34,38,64,.86) 45%, rgba(48,54,86,.84) 100%); }
    }
    /* frosted grain inside the glass */
    .frost { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: .14; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
    /* specular light sweeping across the surface */
    .sweep { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
    .sweep::before { content: ""; position: absolute; top: -50%; left: -60%; width: 45%; height: 200%; transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent); animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { left: -60%; } 100% { left: 130%; } }
    @media (prefers-reduced-motion: reduce) { .sweep::before { animation: none; } .login { transition: none; } }

    .login img { width: 66px; height: 66px; margin: 0 auto 4px; filter: drop-shadow(0 8px 22px rgba(51,140,237,.55)); transform: translateZ(30px); }
    .login h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
    .login p { color: var(--ink-2); margin: -6px 0 8px; }
    .field { text-align: left; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-2); }
    .field input { font: inherit; font-size: 15px; color: var(--ink); border-radius: 16px; padding: 13px 15px; outline: none;
      background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.16)); border: 1px solid rgba(255,255,255,.12);
      box-shadow: inset 0 2px 6px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.08); transition: border-color .2s, box-shadow .2s; }
    .field input:focus { border-color: rgba(90,169,255,.8); box-shadow: inset 0 2px 6px rgba(0,0,0,.35), 0 0 0 4px rgba(51,140,237,.22); }
    .go { position: relative; overflow: hidden; font: inherit; font-weight: 650; font-size: 15px; color: #fff; border: 0; border-radius: 16px; padding: 13px;
      cursor: pointer; margin-top: 6px; background: linear-gradient(180deg, #5aa9ff, #2370cd);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 6px rgba(0,0,0,.2), 0 12px 28px -8px rgba(51,140,237,.85); }
    .go::after { content: ""; position: absolute; inset: 0 0 50% 0; border-radius: 16px 16px 40% 40%; background: linear-gradient(180deg, rgba(255,255,255,.28), transparent); }
    .go:disabled { opacity: .6; cursor: progress; }
    .err { min-height: 18px; font-size: 13px; color: var(--serious); }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="liquidStrong" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="11" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="48" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <form class="login glass" id="form" autocomplete="on">
    <span class="frost" aria-hidden="true"></span><span class="sweep" aria-hidden="true"></span>
    <img src="{{ url_for('static', filename='img/logo-sm.png') }}" alt="">
    <h1>swizzin</h1>
    <p>Sign in to your server</p>
    <label class="field">Username<input name="username" id="basic-username" autocomplete="username" required autofocus></label>
    <label class="field">Password<input name="password" type="password" id="basic-password" autocomplete="current-password" required></label>
    <button class="go" id="btnsubmit" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <script>
    /* Constellation: drifting stars that link to nearby stars and to the pointer. Pauses when the tab is hidden;
       with reduced motion it draws one still frame. */
    (function () {
      var cv = document.getElementById("stars"), ctx = cv.getContext("2d");
      var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var probe = { n: 0, sum: 0 }, W = 0, H = 0, dpr = 1, stars = [], link = 130, mouse = { x: -1e4, y: -1e4, on: false }, shoot = null, raf = 0, last = 0;
      function rnd(a, b) { return a + Math.random() * (b - a); }
      function resize() {
        var z = document.documentElement.currentCSSZoom || 1;
        dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth / z; H = innerHeight / z;
        cv.width = Math.round(W * z * dpr); cv.height = Math.round(H * z * dpr); ctx.setTransform(dpr * z, 0, 0, dpr * z, 0, 0);
        link = Math.max(95, Math.min(150, Math.sqrt(W * H) / 7));
        var n = Math.round(Math.max(55, Math.min(240, (W * H) / 7500)));
        while (stars.length < n) stars.push({ x: rnd(0, W), y: rnd(0, H), vx: rnd(-.18, .18), vy: rnd(-.14, .14),
          r: Math.random() < .12 ? rnd(1.5, 2.2) : rnd(.5, 1.3), t: rnd(0, 6.28), ts: rnd(.6, 1.8), hue: Math.random() < .2 ? 268 : 215 });
        stars.length = n;
      }
      function frame(now) {
        var dt = Math.min(50, now - (last || now)) / 16.67;
        // adaptive quality: if the first ~2 s average under ~35 fps, drop the (GPU-heavy) refraction filter
        if (last && probe.n < 120) { probe.sum += now - last; probe.n++;
          if (probe.n === 120 && probe.sum / probe.n > 28) document.documentElement.dataset.refraction = "off"; }
        last = now;
        ctx.clearRect(0, 0, W, H);
        var i, j, a, b, dx, dy, d, al;
        for (i = 0; i < stars.length; i++) {
          a = stars[i];
          if (!still) {
            a.x += a.vx * dt; a.y += a.vy * dt; a.t += .02 * a.ts * dt;
            if (mouse.on) { dx = mouse.x - a.x; dy = mouse.y - a.y; d = dx * dx + dy * dy;
              if (d < 40000 && d > 400) { a.x += dx * .0009 * dt; a.y += dy * .0009 * dt; } }
            if (a.x < -20) a.x = W + 20; else if (a.x > W + 20) a.x = -20;
            if (a.y < -20) a.y = H + 20; else if (a.y > H + 20) a.y = -20;
          }
        }
        ctx.lineWidth = 1;
        for (i = 0; i < stars.length; i++) {
          a = stars[i];
          for (j = i + 1; j < stars.length; j++) {
            b = stars[j]; dx = a.x - b.x; dy = a.y - b.y;
            if (dx > link || dx < -link || dy > link || dy < -link) continue;
            d = Math.sqrt(dx * dx + dy * dy); if (d > link) continue;
            al = (1 - d / link) * .42;
            ctx.strokeStyle = "rgba(140,170,255," + al.toFixed(3) + ")";
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
          if (mouse.on) { dx = a.x - mouse.x; dy = a.y - mouse.y; d = Math.sqrt(dx * dx + dy * dy);
            if (d < link * 1.4) { ctx.strokeStyle = "rgba(170,195,255," + ((1 - d / (link * 1.4)) * .6).toFixed(3) + ")";
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); } }
        }
        for (i = 0; i < stars.length; i++) {
          a = stars[i]; al = .55 + .45 * Math.sin(a.t);
          if (a.r > 1.4) { var g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r * 5);
            g.addColorStop(0, "hsla(" + a.hue + ",90%,80%," + (.35 * al).toFixed(3) + ")"); g.addColorStop(1, "hsla(" + a.hue + ",90%,70%,0)");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 5, 0, 6.283); ctx.fill(); }
          ctx.fillStyle = "hsla(" + a.hue + ",80%,92%," + (.5 + .5 * al).toFixed(3) + ")";
          ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.283); ctx.fill();
        }
        if (!still) {   // an occasional shooting star
          if (!shoot && Math.random() < .0025 * dt) shoot = { x: rnd(W * .1, W * .9), y: rnd(0, H * .4), vx: rnd(7, 11) * (Math.random() < .5 ? -1 : 1), vy: rnd(3, 5), life: 1 };
          if (shoot) {
            var tx = shoot.x - shoot.vx * 9, ty = shoot.y - shoot.vy * 9, sg = ctx.createLinearGradient(shoot.x, shoot.y, tx, ty);
            sg.addColorStop(0, "rgba(255,255,255," + shoot.life.toFixed(2) + ")"); sg.addColorStop(1, "rgba(160,190,255,0)");
            ctx.strokeStyle = sg; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(tx, ty); ctx.stroke();
            shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt; shoot.life -= .018 * dt;
            if (shoot.life <= 0 || shoot.y > H) shoot = null;
          }
          raf = requestAnimationFrame(frame);
        }
      }
      function start() { cancelAnimationFrame(raf); last = 0; raf = requestAnimationFrame(frame); }
      addEventListener("resize", function () { resize(); if (still) frame(0); });
      addEventListener("pointermove", function (e) { var z = document.documentElement.currentCSSZoom || 1; mouse.x = e.clientX / z; mouse.y = e.clientY / z; mouse.on = true; }, { passive: true });
      document.addEventListener("pointerleave", function () { mouse.on = false; });
      document.addEventListener("visibilitychange", function () { if (document.hidden) cancelAnimationFrame(raf); else if (!still) start(); });
      resize(); if (still) frame(0); else start();
    })();
  </script>
  <script>
    (function () {
      var form = document.getElementById("form");
      var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      // pointer sheen + gentle 3D tilt
      document.addEventListener("pointermove", function (e) {
        var r = form.getBoundingClientRect();
        form.style.setProperty("--mx", (e.clientX - r.left) + "px");
        form.style.setProperty("--my", (e.clientY - r.top) + "px");
        if (still || e.pointerType !== "mouse") return;
        var x = (e.clientX / innerWidth - .5) * 2, y = (e.clientY / innerHeight - .5) * 2;
        form.style.transform = "rotateY(" + (x * 5).toFixed(2) + "deg) rotateX(" + (-y * 5).toFixed(2) + "deg)";
      }, { passive: true });
      document.addEventListener("pointerleave", function () { form.style.transform = ""; });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var u = document.getElementById("basic-username").value, p = document.getElementById("basic-password").value;
        var path = location.pathname.split("/"), url = path.slice(0, path.length - 1).join("/") + "/";
        var btn = document.getElementById("btnsubmit"), err = document.getElementById("err");
        btn.disabled = true; err.textContent = "";
        var x = new XMLHttpRequest();
        x.open("GET", url, true, u, p);        // browser caches the Basic credentials on success
        x.onload = function () {
          btn.disabled = false;
          if (x.status === 200) location.href = url;
          else if (x.status === 429) err.textContent = "Too many attempts — try again in a minute.";
          else err.textContent = "Incorrect username or password.";
        };
        x.onerror = function () { btn.disabled = false; err.textContent = "Server unreachable."; };
        x.send();
      });
    })();
  </script>
</body>
</html>
