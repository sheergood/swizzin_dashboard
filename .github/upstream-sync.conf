# Rules for bringing liaralabs/swizzin_dashboard's changes into this fork
# (.github/scripts/upstream-merge.sh, run weekly by .github/workflows/upstream-sync.yml).
# See the swizzin fork's FORK.md, "Upstream updates".

# Upstream commits are taken only once they're this many days old.
QUARANTINE_DAYS=7

# The panel here is largely rewritten, so a clean merge can still not fit: every upstream change
# waits for your approval.
REVIEW_ALL=true

REVIEW_PATHS=''
PROTECTED_APPS=''
